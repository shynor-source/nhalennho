# ============================================================================
# Production stack — VPS with an existing Nginx Proxy Manager (NPM).
#
#   docker compose --env-file .env.production -f compose.prod.yml config
#   docker compose --env-file .env.production -f compose.prod.yml up -d --build
#
# Hard rules (brief sections 4.4, 7.2):
#   - NO `ports:` mappings for any service. NPM reaches containers over the
#     shared external network by service name + internal port.
#   - PostgreSQL stays on the private app network only and is never published.
#   - This project never runs its own Nginx/NPM container.
#   - NGINX_PROXY_NETWORK must be the owner-provided network name. Never guess.
# ============================================================================
name: qg-web-prod

services:
  database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      # PostgreSQL 18+ images use a version-specific subdirectory; mount the
      # parent /var/lib/postgresql, not /var/lib/postgresql/data.
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_private

  # One-off: apply migrations and seed the initial admin, then exit.
  migrate:
    build:
      context: ./backend
      target: runtime
    image: qg-web-backend:${IMAGE_TAG:-stable}
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    command: ["/app/migrate", "-seed"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - app_private

  backend:
    build:
      context: ./backend
      target: runtime
    image: qg-web-backend:${IMAGE_TAG:-stable}
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    volumes:
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      # app_private for the database; npm_proxy for incoming proxied traffic.
      - app_private
      - npm_proxy

  frontend:
    build:
      context: ./frontend
      target: runtime
      # Public values are inlined at build time (see frontend/Dockerfile).
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:?set in .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set in .env.production}
        NEXT_PUBLIC_SITE_TAGLINE: ${NEXT_PUBLIC_SITE_TAGLINE:?set in .env.production}
        NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:?set in .env.production}
        NEXT_PUBLIC_SHOPEE_URL: ${NEXT_PUBLIC_SHOPEE_URL:?set in .env.production}
        NEXT_PUBLIC_ZALO_URL: ${NEXT_PUBLIC_ZALO_URL:?set in .env.production}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:?set in .env.production}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set in .env.production}
    image: qg-web-frontend:${IMAGE_TAG:-stable}
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_private
      - npm_proxy

volumes:
  pgdata:

networks:
  # Internal network for service-to-service and database traffic.
  app_private:
    internal: true
  # Existing network owned and managed by the NPM setup. Compose must not
  # create or delete it; the name is supplied by the owner.
  npm_proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK:?set NGINX_PROXY_NETWORK in .env.production}
