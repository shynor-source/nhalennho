# ============================================================================
# Development stack — local machine, no Nginx Proxy Manager.
#
#   docker compose --env-file .env.dev -f compose.dev.yml config
#   docker compose --env-file .env.dev -f compose.dev.yml up --build
#   docker compose --env-file .env.dev -f compose.dev.yml down
#
# Host ports are published on 127.0.0.1 only. Never use this file on the VPS.
# ============================================================================
name: qg-web-dev

services:
  database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.dev}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images use a version-specific subdirectory; mount the
      # parent /var/lib/postgresql, not /var/lib/postgresql/data.
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_dev

  # One-off: apply migrations and seed dev data, then exit success.
  migrate:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env.dev
    environment:
      GOFLAGS: -mod=mod
    command: ["go", "run", "./cmd/migrate", "-seed"]
    volumes:
      - ./backend:/src
      - gomodcache:/go/pkg/mod
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - app_dev

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      GOFLAGS: -mod=mod
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Bind-mount source for live reload via `go run`.
      - ./backend:/src
      - gomodcache:/go/pkg/mod
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_dev

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      # Keep container-installed deps and build cache out of the host mount.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_dev

volumes:
  pgdata:
  gomodcache:
  frontend_node_modules:
  frontend_next:

networks:
  app_dev:
    driver: bridge
